services:
  postgres:
    image: postgres:16-alpine
    container_name: mrp-postgres
    environment:
      POSTGRES_DB: mrp
      POSTGRES_USER: mrp
      POSTGRES_PASSWORD: mrp
    ports:
      - "${MRP_DB_PORT:-5432}:5432"
    volumes:
      - mrp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrp -d mrp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mrp_pgdata:
